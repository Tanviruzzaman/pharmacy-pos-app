name: pharmacy_pos
description: Offline-first pharmacy POS - quick sale, stock with expiry, baki khata, daily report.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  intl: ^0.20.2
  share_plus: ^10.0.0
  file_picker: ^8.0.6
  pdf: ^3.12.0
  printing: ^5.14.3
  print_bluetooth_thermal: ^1.2.1
  # 13.x pulls permission_handler_android 14, whose Gradle script needs a newer Kotlin plugin.
  permission_handler: ^12.0.1
  # Not used directly. pdf caps archive <4.1, but image 4.11+ calls an archive 4.1 API.
  image: ">=4.5.0 <4.11.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  generate: true
